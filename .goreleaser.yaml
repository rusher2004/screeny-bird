version: 2

project_name: screeny

builds:
  - id: screeny
    main: ./cmd
    binary: screeny
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "screeny_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true
